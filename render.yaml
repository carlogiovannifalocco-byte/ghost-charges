services:
  - type: web
    name: ghost-charges
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      # Gemma through Google AI Studio's OpenAI-compatible endpoint. Paste the key in the Render
      # dashboard, never in this file. Without a key, set GHOST_NO_MODEL=1 and the demo runs on rules only.
      - key: LLM_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: LLM_MODEL
        value: gemma-4-26b-a4b-it
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MIN_INTERVAL
        value: "2"
